<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizzaria App</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="phone-frame">
    <header class="top-bar">
      <p class="address">Rua Mesquita, 248 <span class="arrow">▼</span></p>
    </header>

    <main>
      <section class="user-info">
        <h2>Olá, <strong>Daniela</strong></h2>
        <a href="#" class="points-link">Ver meus pontos</a>
        <div class="points-badge">112 pontos</div>
      </section>

      <section class="promocoes">
        <h3>Promoções</h3>
        <div class="promo-cards">
          <div class="card">
            <img src="Pizza.png" alt="Pizza em dobro">
            <h4>Pizza em dobro</h4>
            <p>Compre uma pizza e ganhe outra</p>
          </div>
          <div class="card">
            <img src="Pizza-coca-cola.png" alt="Pizza de Calabresa">
            <h4>Pizza de Calabresa</h4>
            <p>Pizza + Coca-Cola</p>
          </div>
        </div>
      </section>

      <section class="reorder">
        <h3>Peça novamente</h3>
        <div class="pizza-card">
          <img src="Pizza de margerita.jpg" alt="Margerita">
          <div class="pizza-info">
            <h4>Margerita</h4>
            <p class="price">R$ 93,00</p>
            <a href="#" class="add-cart">Adicionar à sacola</a>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="#" class="active">
        <span class=""><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg></span>
        <span>Início</span>
      </a>
      <a href="#">
        <span class=""><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg></span>
        <span>Busca</span>
      </a>
      <a href="#">
        <span class=""><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg></span>
        <span>Menu</span>
      </a>
      <a href="#">
        <span class=""><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M240-280h240v-80H240v80Zm120-160h240v-80H360v80Zm120-160h240v-80H480v80ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/></svg></span>
        <span>Pedidos</span>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzalivery</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <h1 class="logo">Pizzalivery</h1>
        <ul class="menu">
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="house"></i>
                    <span>
                        Início
                    </span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="search"></i>
                    <span>
                        Busca
                    </span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="menu"></i>
                    <span>
                        Menu
                    </span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="receipt-text"></i>
                    <span>
                        Pedidos
                    </span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="user-round"></i>
                    <span>
                        Perfil
                    </span>
                </a>
            </li>
        </ul>
    </nav>
    <main class="container">
      <header class="header">
        <div class="delivery-address">
          <span class="delivery-text">Entregando no endereço: </span>
          <span>Rua Mesquita, 248</span>
          <i data-lucide="chevron-down"></i>
        </div>
        <div class="greeting-user">
          
          <div class="user-info">
            <p>Olá, Daniela</p>
            <a href="#">Ver meus pontos</a>
          </div>
          
          <div class="user-points">
            <span>112 pontos</span>
          </div>
        </div>
      </header>
      <section>
        <h2>Promoções</h2>
        <img class="promotion-img" src="images/depositphotos_15951851-stock-photo-fresh-pizza.webp" alt="Foto de pizza numa mesa com fatia cortada">
        <p class="bold">Pizza em dobro</p>
        <p class="prom-description">Compre uma pizza e ganhe outra</p>
      </section>
      <section>
        <h2 class="order-again-title">Peça novamente</h2>
        <img class="order-again-img" src="images/160572915436349060139189700225-1080p.jpg" alt="">
        <p class="order-again-flavor">Margherita</p>
        <p class="order-again-price">R$ 93,00</p>
        <a class="order-again-add" href="">Adicionar à sacola</a>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
      </script>
</body>
</html>>

<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizzalivery</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <nav>
        <h1 class="logo">Pizzalivery</h1>
        <ul class="menu">
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="house"></i>
                    <span>
                        Início
                    </span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="search"></i>
                    <span>
                        Busca
                    </span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="menu"></i>
                    <span>
                        Menu
                    </span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="receipt-text"></i>
                    <span>
                        Pedidos
                    </span>
                </a>
            </li>
            <li class="menu-item">
                <a class="menu-link" href="">
                    <i data-lucide="user-round"></i>
                    <span>
                        Perfil
                    </span>
                </a>
            </li>
        </ul>
    </nav>
    <main class="container">
    <header class="header">
        <div class="informacoes-usuario">
          <span class="endereco">Entregando no endereço: </span>
          <span>Rua Mesquita, 248</span>
          <i data-lucide="chevron-down"></i>
        </div>
        <div class="usuario">
          
          <div class="nome-usuario">
            <p>Olá, Daniela</p>
            <a href="#">Ver meus pontos</a>
          </div>
          
          <div class="pontos-usuario">
            <span>112 pontos</span>
          </div>
        </div>
      </header>
      <section>
        <h2>Promoções</h2>
        <img class="foto-promocao" src="images/depositphotos_15951851-stock-photo-fresh-pizza.webp" alt="Imagem de fatia de pizza corta em cima de uma mesa">
        <p class="bold">Pizza em dobro</p>
        <p class="descricao-promocao">Compre uma pizza e ganhe outra</p>
      </section>
      <section>
        <h2 class="order-again-titulo">Peça novamente</h2>
        <img class="order-again-imagem" src="images/160572915436349060139189700225-1080p.jpg" alt="">
        <p class="order-again-sabor">Margherita</p>
        <p class="order-again-preco">R$ 93,00</p>
        <a class="order-again-add" href="">Adicionar à sacola</a>
      </section>
    </main>  
    <script src="./js/script.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
  
</html>
